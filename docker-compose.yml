services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: newsradar
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./newsradar_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://newsradar:newsradar123@db:5432/newsradar
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SECRET_KEY: "your-secret-key-change-in-production"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./newsradar_api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: