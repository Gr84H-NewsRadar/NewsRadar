<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsRadar — Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5 d-flex align-items-center justify-content-center">
        <div class="card bg-secondary text-light shadow-lg" style="width: 28rem;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 data-i18n="join">ÚNETE A LA RED</h3>
                    <p class="text-muted small" data-i18n="join_sub">Crea tu cuenta de analista</p>
                </div>

                <div id="register-error" class="alert alert-danger d-none"></div>
                <div id="register-success" class="alert alert-success d-none"></div>

                <form id="register-form">
                    <div class="row g-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small" data-i18n="firstname">NOMBRE</label>
                            <input type="text" class="form-control" id="first_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small" data-i18n="lastname">APELLIDOS</label>
                            <input type="text" class="form-control" id="last_name" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" data-i18n="email">EMAIL</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" data-i18n="organization">ORGANIZACIÓN</label>
                        <input type="text" class="form-control" id="organization" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">TELÉFONO</label>
                        <input type="tel" class="form-control" id="telefono" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" minlength="9" placeholder="123456789" required>
                        <div class="form-text text-light-emphasis">9 dígitos numéricos.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" data-i18n="password">CONTRASEÑA</label>
                        <input type="password" class="form-control" id="password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-light w-100" data-i18n="create">CREAR MI CUENTA →</button>
                </form>

                <div class="mt-3 text-center small">
                    <a href="/static/index.html" class="text-light" data-i18n="have_account">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                organization: document.getElementById('organization').value,
                telefono: document.getElementById('telefono').value,
                password: document.getElementById('password').value,
                role_ids: []
            };
            const errBox = document.getElementById('register-error');
            const okBox = document.getElementById('register-success');
            errBox.classList.add('d-none');
            okBox.classList.add('d-none');

            try {
                await api.register(data);
                okBox.textContent = 'A verification email has been sent. Please check your inbox before logging in.';
                okBox.classList.remove('d-none');
                document.getElementById('register-form').classList.add('d-none');
            } catch (err) {
                errBox.textContent = err.message || 'Error al crear cuenta';
                errBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
