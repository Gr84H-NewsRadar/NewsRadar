<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NewsRadar — Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="d-flex">
        <nav id="sidebar" class="bg-dark text-light p-3" style="width:240px;min-height:100vh;">
            <div class="d-flex align-items-center mb-4"><i class="bi bi-broadcast me-2 fs-4"></i><h4 class="mb-0">NEWSRADAR</h4></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/static/dashboard.html" class="nav-link text-light"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/static/wordcloud.html" class="nav-link text-light"><i class="bi bi-cloud me-2"></i><span data-i18n="resumen">Resumen</span></a></li>
                <li class="nav-item"><a href="/static/alerts.html" class="nav-link text-light"><i class="bi bi-bell me-2"></i><span data-i18n="alerts">Alertas</span></a></li>
                <li class="nav-item"><a href="/static/sources.html" class="nav-link text-light"><i class="bi bi-rss me-2"></i><span data-i18n="sources">Fuentes y RSS</span></a></li>
                <li class="nav-item"><a href="/static/notifications.html" class="nav-link text-light"><i class="bi bi-envelope me-2"></i><span data-i18n="notifications">Notificaciones</span></a></li>
                <li class="nav-item"><a href="/static/search.html" class="nav-link text-light"><i class="bi bi-search me-2"></i><span data-i18n="search">Búsqueda</span></a></li>
                <li class="nav-item"><a href="/static/profile.html" class="nav-link text-light active"><i class="bi bi-person me-2"></i><span data-i18n="profile">Perfil</span></a></li>
            </ul>
            <div class="mt-auto pt-5">
                <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="toggleLanguage()">🌐 <span id="lang-btn">EN</span></button>
                <button class="btn btn-sm btn-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="logout">Cerrar Sesión</span></button>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light">
            <h2 data-i18n="profile_title">Mi Perfil</h2>

            <div class="card bg-dark text-light mb-4">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center">
                        <div class="avatar bg-light text-dark d-flex align-items-center justify-content-center me-3" style="width:80px;height:80px;border-radius:50%;font-size:2rem;font-weight:bold;" id="avatar-initials">??</div>
                        <div>
                            <h3 id="user-fullname">—</h3>
                            <small id="user-org" class="text-muted">—</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 data-i18n="personal_info">INFORMACIÓN PERSONAL</h5>
                            <div id="profile-msg" class="alert d-none"></div>
                            <form id="profile-form">
                                <div class="row g-2">
                                    <div class="col-md-6 mb-3"><label class="form-label small" data-i18n="firstname">NOMBRE</label><input type="text" class="form-control" id="p-firstname"></div>
                                    <div class="col-md-6 mb-3"><label class="form-label small" data-i18n="lastname">APELLIDOS</label><input type="text" class="form-control" id="p-lastname"></div>
                                </div>
                                <div class="mb-3"><label class="form-label small" data-i18n="email">EMAIL</label><input type="email" class="form-control" id="p-email" disabled></div>
                                <div class="mb-3"><label class="form-label small" data-i18n="organization">ORGANIZACIÓN</label><input type="text" class="form-control" id="p-org"></div>
                                <button type="button" class="btn btn-dark" onclick="saveProfile()" data-i18n="edit_profile">EDITAR PERFIL</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <h5 data-i18n="security">SEGURIDAD</h5>
                            <button class="btn btn-light w-100 mb-2" onclick="openPasswordModal()"><i class="bi bi-key"></i> <span data-i18n="change_password">Cambiar Contraseña</span></button>
                        </div>
                    </div>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 data-i18n="roles_perms">ROLES Y PERMISOS</h5>
                            <div id="roles-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/profile.js"></script>
</body>
</html>
