<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NewsRadar — Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="d-flex">
        <nav id="sidebar" class="bg-dark text-light p-3" style="width:240px;min-height:100vh;">
            <div class="d-flex align-items-center mb-4"><i class="bi bi-broadcast me-2 fs-4"></i><h4 class="mb-0">NEWSRADAR</h4></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/static/dashboard.html" class="nav-link text-light"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/static/wordcloud.html" class="nav-link text-light"><i class="bi bi-cloud me-2"></i><span data-i18n="resumen">Resumen</span></a></li>
                <li class="nav-item"><a href="/static/alerts.html" class="nav-link text-light"><i class="bi bi-bell me-2"></i><span data-i18n="alerts">Alertas</span></a></li>
                <li class="nav-item"><a href="/static/sources.html" class="nav-link text-light"><i class="bi bi-rss me-2"></i><span data-i18n="sources">Fuentes y RSS</span></a></li>
                <li class="nav-item"><a href="/static/notifications.html" class="nav-link text-light"><i class="bi bi-envelope me-2"></i><span data-i18n="notifications">Notificaciones</span></a></li>
                <li class="nav-item"><a href="/static/search.html" class="nav-link text-light active"><i class="bi bi-search me-2"></i><span data-i18n="search">Búsqueda</span></a></li>
                <li class="nav-item"><a href="/static/profile.html" class="nav-link text-light"><i class="bi bi-person me-2"></i><span data-i18n="profile">Perfil</span></a></li>
            </ul>
            <div class="mt-auto pt-5">
                <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="toggleLanguage()">🌐 <span id="lang-btn">EN</span></button>
                <button class="btn btn-sm btn-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="logout">Cerrar Sesión</span></button>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light">
            <h2 data-i18n="search_title">Búsqueda y Filtrado de Noticias</h2>
            <p class="text-muted small" data-i18n="search_sub">Filtra y busca en todas las noticias capturadas por el sistema</p>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label small" data-i18n="search_keyword">Palabra clave</label>
                            <input type="text" class="form-control" id="filter-q" placeholder="ej: inteligencia artificial">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small" data-i18n="filter_category">Categoría</label>
                            <select class="form-select" id="filter-category">
                                <option value="">— todas —</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small" data-i18n="filter_from">Desde</label>
                            <input type="date" class="form-control" id="filter-from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small" data-i18n="filter_to">Hasta</label>
                            <input type="date" class="form-control" id="filter-to">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-dark" onclick="doSearch()"><i class="bi bi-search"></i> <span data-i18n="search_btn">Buscar</span></button>
                        <button class="btn btn-light" onclick="clearFilters()"><span data-i18n="clear">Limpiar</span></button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 id="results-count">—</h5>
                    <div id="results-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/search.js"></script>
</body>
</html>
