<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NewsRadar — Alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="d-flex">
        <nav id="sidebar" class="bg-dark text-light p-3" style="width:240px;min-height:100vh;">
            <div class="d-flex align-items-center mb-4"><i class="bi bi-broadcast me-2 fs-4"></i><h4 class="mb-0">NEWSRADAR</h4></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/static/dashboard.html" class="nav-link text-light"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/static/wordcloud.html" class="nav-link text-light"><i class="bi bi-cloud me-2"></i><span data-i18n="resumen">Resumen</span></a></li>
                <li class="nav-item"><a href="/static/alerts.html" class="nav-link text-light active"><i class="bi bi-bell me-2"></i><span data-i18n="alerts">Alertas</span></a></li>
                <li class="nav-item"><a href="/static/sources.html" class="nav-link text-light"><i class="bi bi-rss me-2"></i><span data-i18n="sources">Fuentes y RSS</span></a></li>
                <li class="nav-item"><a href="/static/notifications.html" class="nav-link text-light"><i class="bi bi-envelope me-2"></i><span data-i18n="notifications">Notificaciones</span></a></li>
                <li class="nav-item"><a href="/static/search.html" class="nav-link text-light"><i class="bi bi-search me-2"></i><span data-i18n="search">Búsqueda</span></a></li>
                <li class="nav-item"><a href="/static/profile.html" class="nav-link text-light"><i class="bi bi-person me-2"></i><span data-i18n="profile">Perfil</span></a></li>
            </ul>
            <div class="mt-auto pt-5">
                <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="toggleLanguage()">🌐 <span id="lang-btn">EN</span></button>
                <button class="btn btn-sm btn-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="logout">Cerrar Sesión</span></button>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light">
            <div class="d-flex justify-content-between mb-4">
                <div>
                    <h2 data-i18n="alerts_title">Gestión de Alertas</h2>
                    <small class="text-muted" data-i18n="alerts_sub">Configura tus radares de información personalizados</small>
                </div>
                <button class="btn btn-dark" onclick="openAlertModal()" id="btn-new-alert">
                    <i class="bi bi-plus"></i> <span data-i18n="new_alert">Nueva Alerta</span>
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th data-i18n="alert_name">NOMBRE DE LA ALERTA</th>
                                <th data-i18n="descriptors">DESCRIPTORES</th>
                                <th data-i18n="categories">CATEGORÍAS</th>
                                <th data-i18n="cron">PERIODICIDAD</th>
                                <th data-i18n="actions">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-table"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Crear/Editar Alerta -->
    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="create_alert">CREAR NUEVA ALERTA</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="alert-form">
                        <input type="hidden" id="alert-id">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="alert_name">NOMBRE DE LA ALERTA</label>
                            <input type="text" class="form-control" id="alert-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="descriptors_csv">DESCRIPTORES (separados por coma)</label>
                            <input type="text" class="form-control" id="alert-descriptors" placeholder="IA, robotica, chips" required>
                            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="suggestSynonyms()">
                                <i class="bi bi-magic"></i> <span data-i18n="suggest">Sugerir sinónimos (IA)</span>
                            </button>
                            <div id="synonym-suggestions" class="mt-2"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="cron_label">PERIODICIDAD (CRON)</label>
                            <input type="text" class="form-control" id="alert-cron" placeholder="0 */6 * * *" value="0 */6 * * *" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="categories">CATEGORÍAS</label>
                            <select class="form-select" id="alert-category">
                                <option value="">— ninguna —</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="notify-email" checked><label class="form-check-label" data-i18n="notify_email">Notificar por correo</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="notify-inbox" checked><label class="form-check-label" data-i18n="notify_inbox">Notificar al buzón</label></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">CANCELAR</button>
                    <button class="btn btn-dark" onclick="saveAlert()" data-i18n="save_alert">GUARDAR ALERTA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/alerts.js"></script>
</body>
</html>
