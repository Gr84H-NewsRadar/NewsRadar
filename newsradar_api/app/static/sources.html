<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NewsRadar — Fuentes RSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="d-flex">
        <nav id="sidebar" class="bg-dark text-light p-3" style="width:240px;min-height:100vh;">
            <div class="d-flex align-items-center mb-4"><i class="bi bi-broadcast me-2 fs-4"></i><h4 class="mb-0">NEWSRADAR</h4></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/static/dashboard.html" class="nav-link text-light"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/static/wordcloud.html" class="nav-link text-light"><i class="bi bi-cloud me-2"></i><span data-i18n="resumen">Resumen</span></a></li>
                <li class="nav-item"><a href="/static/alerts.html" class="nav-link text-light"><i class="bi bi-bell me-2"></i><span data-i18n="alerts">Alertas</span></a></li>
                <li class="nav-item"><a href="/static/sources.html" class="nav-link text-light active"><i class="bi bi-rss me-2"></i><span data-i18n="sources">Fuentes y RSS</span></a></li>
                <li class="nav-item"><a href="/static/notifications.html" class="nav-link text-light"><i class="bi bi-envelope me-2"></i><span data-i18n="notifications">Notificaciones</span></a></li>
                <li class="nav-item"><a href="/static/search.html" class="nav-link text-light"><i class="bi bi-search me-2"></i><span data-i18n="search">Búsqueda</span></a></li>
                <li class="nav-item"><a href="/static/profile.html" class="nav-link text-light"><i class="bi bi-person me-2"></i><span data-i18n="profile">Perfil</span></a></li>
            </ul>
            <div class="mt-auto pt-5">
                <button class="btn btn-sm btn-outline-light w-100 mb-2" onclick="toggleLanguage()">🌐 <span id="lang-btn">EN</span></button>
                <button class="btn btn-sm btn-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="logout">Cerrar Sesión</span></button>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light">
            <div class="d-flex justify-content-between mb-4">
                <h2 data-i18n="sources_title">Fuentes e Información</h2>
                <div>
                    <button class="btn btn-outline-dark me-2" id="tab-sources" onclick="showTab('sources')" data-i18n="sources_tab">FUENTES</button>
                    <button class="btn btn-outline-dark me-2" id="tab-channels" onclick="showTab('channels')" data-i18n="channels_tab">CANALES RSS</button>
                    <button class="btn btn-dark" onclick="openSourceModal()" id="btn-add-source">
                        <i class="bi bi-plus"></i> <span data-i18n="add_source">Añadir Fuente</span>
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <input type="text" class="form-control mb-3" id="filter-input" placeholder="Filtrar..." oninput="filterList()">
                    <div id="sources-list"></div>
                    <div id="channels-list" style="display:none;"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="sourceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="add_source_title">AÑADIR FUENTE</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="source-form">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="source_name">NOMBRE DE LA FUENTE</label>
                            <input type="text" class="form-control" id="source-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="source_url">URL</label>
                            <input type="url" class="form-control" id="source-url" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">CANCELAR</button>
                    <button class="btn btn-dark" onclick="saveSource()" data-i18n="save">GUARDAR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/sources.js"></script>
</body>
</html>
