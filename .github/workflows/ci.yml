name: CI/CD Pipeline

env:
  COVERAGE_MIN: "60"
  PYLINT_MIN_SCORE: "8.0"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linting tools
      run: pip install ruff black isort
    - name: Run linters
      run: |
        cd newsradar_api
        ruff check app
        black --check app
        isort --check-only app --profile black

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: newsradar_test
          POSTGRES_USER: newsradar
          POSTGRES_PASSWORD: newsradar123
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd newsradar_api
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://newsradar:newsradar123@localhost:5432/newsradar_test
      run: |
        cd newsradar_api
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=${COVERAGE_MIN}
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: newsradar_api/coverage.xml

  code-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage-report
        path: newsradar_api
    - name: Install quality tools
      run: |
        pip install ruff pylint radon
        cd newsradar_api
        pip install -r requirements.txt
    - name: Run quality metrics and gates
      run: |
        mkdir -p quality-reports
        cd newsradar_api

        # Bugs and critical issues
        ruff check app | tee ../quality-reports/ruff.txt

        # Code smells and duplication metric
        pylint app --rcfile=.pylintrc --fail-under=${PYLINT_MIN_SCORE} | tee ../quality-reports/pylint.txt

        # Complexity metric report
        radon cc app -s -a | tee ../quality-reports/radon-cc.txt
    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: quality-reports/

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker images
      run: docker compose build