name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, objetivo-7/devops-infraestructura ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install linting tools
      run: pip install flake8 black isort
    - name: Run linters
      run: |
        cd newsradar_api
        flake8 app --count --select=E9,F63,F7,F82 || true
        black --check app || true
        isort --check-only app || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: newsradar_test
          POSTGRES_USER: newsradar
          POSTGRES_PASSWORD: newsradar123
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd newsradar_api
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://newsradar:newsradar123@localhost:5432/newsradar_test
      run: |
        cd newsradar_api
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term || true
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: newsradar_api/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker images
      run: docker compose build